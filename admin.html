<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>മീൻ കട — Admin Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <!-- Google Fonts: Poppins (English) & Noto Sans Malayalam (Malayalam) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-primary: #0a7ea4;
      --color-primary-dark: #075e7a;
      --color-danger: #c0392b;
      --color-danger-dark: #a93226;
      --color-bg: #f8faf9;
      --color-card-bg: #ffffff;
      --color-border: #e2e8e5;
      --color-text-main: #1a1a1a;
      --color-text-muted: #666666;
      --font-en: 'Poppins', sans-serif;
      --font-ml: 'Noto Sans Malayalam', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-en);
      background-color: var(--color-bg);
      color: var(--color-text-main);
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      /* Add bottom padding to body so FAB doesn't cover last list item */
      padding-bottom: 100px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 600px;
    }

    /* Header */
    .admin-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .admin-title {
      font-family: var(--font-ml);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1.3;
    }

    .admin-subtitle {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Today's Menu Section Header */
    .menu-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-border);
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-count {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-muted);
      background: #eef2f5;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .btn-deactivate-all {
      background: var(--color-danger);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-deactivate-all:hover {
      background: var(--color-danger-dark);
    }

    .btn-deactivate-all:active {
      transform: scale(0.96);
    }

    .btn-deactivate-all:disabled {
      background: #e6a19a;
      cursor: not-allowed;
    }

    /* Active Fish List */
    .fish-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fish-item-card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .fish-item-card:hover {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.07);
    }

    .fish-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .fish-item-thumb {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      object-fit: cover;
      background: #eef3f0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 1px solid var(--color-border);
    }

    .fish-item-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .fish-item-name-ml {
      font-family: var(--font-ml);
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fish-item-name-en {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fish-item-price {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-top: 2px;
    }

    .btn-deactivate {
      background: #fee;
      color: var(--color-danger);
      border: 1px solid #fcc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-deactivate:hover {
      background: var(--color-danger);
      color: #fff;
    }

    .btn-deactivate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Empty and Loading States */
    .list-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--color-text-muted);
      font-size: 0.9rem;
      background: #fff;
      border-radius: 14px;
      border: 1px dashed var(--color-border);
    }

    /* Floating Action Button (FAB) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0a7ea4;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(10, 126, 164, 0.4);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fab-btn:hover { background: #075e7a; transform: translateY(-2px); }
    .fab-btn:active { transform: translateY(0); }

    /* Overlay CSS from customer site */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.hidden { display: none; }
    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
    }
    .overlay-content {
      position: relative;
      background: #fff;
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 24px;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @media (min-width: 768px) {
      .overlay { align-items: center; }
      .overlay-content {
        border-radius: 20px;
        max-height: 88vh;
        padding: 28px;
      }
    }
    .overlay-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.06);
      font-size: 18px;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay-close:hover { background: rgba(0, 0, 0, 0.12); }

    .form-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 16px;
      padding-right: 36px;
    }

    /* Form Elements inside Popup */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 6px;
    }

    .form-label .optional {
      font-size: 12px;
      font-weight: 400;
      color: #888888;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      box-sizing: border-box;
      background: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(10, 126, 164, 0.12);
    }

    .input-ml {
      font-family: var(--font-ml);
    }

    .price-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .price-prefix {
      position: absolute;
      left: 12px;
      font-weight: 600;
      color: #555;
      font-size: 15px;
      pointer-events: none;
    }

    .price-input {
      padding-left: 28px;
    }

    .price-preview {
      font-size: 13px;
      color: #055a33;
      background: #eef7f2;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 8px;
      font-weight: 500;
    }

    .price-preview.hidden {
      display: none;
    }

    .file-dropzone {
      border: 2px dashed #b8c7cf;
      border-radius: 12px;
      padding: 18px 16px;
      text-align: center;
      background: #fafcfb;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
      position: relative;
    }

    .file-dropzone:hover {
      border-color: var(--color-primary);
      background: #f1f7f9;
    }

    .file-dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .dropzone-label {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .dropzone-sub {
      font-size: 12px;
      color: #888;
      font-weight: 400;
    }

    .preview-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .preview-img {
      max-width: 160px;
      max-height: 160px;
      width: auto;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e0e0e0;
      display: block;
    }

    .preview-container.hidden {
      display: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--color-primary);
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      font-family: inherit;
      border: none;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-submit:hover {
      background: var(--color-primary-dark);
    }

    .btn-submit:active {
      transform: scale(0.985);
    }

    .btn-submit:disabled {
      background: #7fb3c7;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      background: #fee;
      color: #c0392b;
      padding: 12px 14px;
      border-radius: 8px;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.4;
      border: 1px solid #fcc;
    }

    .error-box.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <main class="dashboard-container">
    <!-- Header -->
    <header class="admin-header">
      <h1 class="admin-title">🐟 മീൻ കട — Admin Dashboard</h1>
      <p class="admin-subtitle">Manage today's fish catalog & inventory</p>
    </header>

    <!-- Today's Menu Section -->
    <section>
      <div class="menu-header-bar">
        <h2 class="menu-title">
          Today's Menu
          <span id="menuCount" class="menu-count">0</span>
        </h2>
        <button id="deactivateAllBtn" class="btn-deactivate-all" onclick="deactivateAllFish()">
          Deactivate All
        </button>
      </div>

      <!-- Fish List Container -->
      <div id="fishList" class="fish-list">
        <div class="list-state">Loading active fish menu...</div>
      </div>
    </section>
  </main>

  <!-- Floating Action Button (FAB) -->
  <button id="fab-add-fish" class="fab-btn" onclick="openAddFish()" aria-label="Add Fish">
    + Add Fish
  </button>

  <!-- Add Fish Popup Overlay -->
  <div id="add-fish-overlay" class="overlay hidden">
    <div class="overlay-backdrop"></div>
    <div class="overlay-content">
      <button class="overlay-close" onclick="closeAddFish()" aria-label="Close">✕</button>
      <h2 class="form-title">Add New Fish</h2>

      <form id="add-fish-form" novalidate>
        <!-- Fish Image Picker -->
        <div class="form-group">
          <label class="form-label">Fish Image <span style="color:#c0392b;">*</span></label>
          <div class="file-dropzone" id="dropzone">
            <input type="file" id="fishImage" accept="image/png,image/jpeg,image/webp" required>
            <div class="dropzone-label">
              <span>📷 Choose fish image</span>
              <span class="dropzone-sub">PNG, JPG, or WEBP</span>
            </div>
          </div>
          <div id="previewContainer" class="preview-container hidden">
            <img id="imagePreview" class="preview-img" alt="Selected fish preview">
          </div>
        </div>

        <!-- Malayalam Name -->
        <div class="form-group">
          <label class="form-label" for="nameMl">Malayalam Name <span style="color:#c0392b;">*</span></label>
          <input type="text" id="nameMl" class="form-input input-ml" placeholder="e.g. അയില" required>
        </div>

        <!-- English Name -->
        <div class="form-group">
          <label class="form-label" for="nameEn">English Name <span style="color:#c0392b;">*</span></label>
          <input type="text" id="nameEn" class="form-input" placeholder="e.g. Kingfish" required>
        </div>

        <!-- Selling Price -->
        <div class="form-group">
          <label class="form-label" for="price">Selling Price <span style="color:#c0392b;">*</span></label>
          <div class="price-wrapper">
            <span class="price-prefix">₹</span>
            <input type="number" id="price" class="form-input price-input" placeholder="e.g. 320" min="1" step="1" required>
          </div>
          <div id="pricePreview" class="price-preview hidden"></div>
        </div>

        <!-- Note (Optional) -->
        <div class="form-group">
          <label class="form-label" for="note">Note <span class="optional">(optional)</span></label>
          <input type="text" id="note" class="form-input" placeholder="e.g. Best for curry, freshly caught">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">Add Fish</button>

        <!-- Error Box -->
        <div id="errorBox" class="error-box hidden" role="alert"></div>
      </form>
    </div>
  </div>

  <script>
    // ============ CONFIG ============
    const API_BASE = "http://localhost:5000";

    function getEndpoint(path) {
      // Use relative path on production (Vercel), absolute localhost only when running locally via file:// or port 5000
      if (window.location.protocol === "file:") return `${API_BASE}${path}`;
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") return `${API_BASE}${path}`;
      return path; // production: relative path, same origin
    }

    // ============ ELEMENTS ============
    const overlay = document.getElementById("add-fish-overlay");
    const form = document.getElementById("add-fish-form");
    const fileInput = document.getElementById("fishImage");
    const previewContainer = document.getElementById("previewContainer");
    const imagePreview = document.getElementById("imagePreview");
    const nameMlInput = document.getElementById("nameMl");
    const nameEnInput = document.getElementById("nameEn");
    const priceInput = document.getElementById("price");
    const noteInput = document.getElementById("note");
    const pricePreview = document.getElementById("pricePreview");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("errorBox");

    const fishListEl = document.getElementById("fishList");
    const menuCountEl = document.getElementById("menuCount");
    const deactivateAllBtn = document.getElementById("deactivateAllBtn");

    // ============ POPUP CONTROLS ============
    function openAddFish() {
      clearError();
      overlay.classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeAddFish() {
      overlay.classList.add("hidden");
      document.body.style.overflow = "";
      form.reset();
      imagePreview.src = "";
      previewContainer.classList.add("hidden");
      pricePreview.textContent = "";
      pricePreview.classList.add("hidden");
      clearError();
    }

    // Backdrop click listener
    document.querySelector("#add-fish-overlay .overlay-backdrop").addEventListener("click", closeAddFish);

    // Escape key listener
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !overlay.classList.contains("hidden")) {
        closeAddFish();
      }
    });

    // ============ HELPER FUNCTIONS ============
    function calculateOriginal(price) {
      const raw = price * 1.25;
      return Math.ceil(raw / 5) * 5;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    // ============ IMAGE PREVIEW ============
    fileInput.addEventListener("change", () => {
      clearError();
      const file = fileInput.files[0];
      if (!file) {
        imagePreview.src = "";
        previewContainer.classList.add("hidden");
        return;
      }

      if (!file.type.startsWith("image/")) {
        showError("Please select a valid image file (JPG, PNG, or WEBP).");
        fileInput.value = "";
        imagePreview.src = "";
        previewContainer.classList.add("hidden");
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        imagePreview.src = e.target.result;
        previewContainer.classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    });

    // ============ PRICE PREVIEW ============
    priceInput.addEventListener("input", () => {
      const priceVal = parseFloat(priceInput.value);
      if (priceVal && priceVal > 0) {
        const original = calculateOriginal(priceVal);
        const discount = Math.round((1 - priceVal / original) * 100);
        pricePreview.textContent = `Original price: ₹${original} · Discount: ${discount}%`;
        pricePreview.classList.remove("hidden");
      } else {
        pricePreview.textContent = "";
        pricePreview.classList.add("hidden");
      }
    });

    // ============ LOAD ACTIVE FISH MENU ============
    async function loadActiveFish() {
      try {
        fishListEl.innerHTML = `<div class="list-state">Loading active fish menu...</div>`;
        const res = await fetch(getEndpoint("/api/admin/fish"));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        menuCountEl.textContent = data.length || 0;

        if (!data || data.length === 0) {
          fishListEl.innerHTML = `
            <div class="list-state">
              🐟 No active fish in today's menu.<br>
              Tap <strong>"+ Add Fish"</strong> below to add one.
            </div>
          `;
          deactivateAllBtn.disabled = true;
          return;
        }

        deactivateAllBtn.disabled = false;
        fishListEl.innerHTML = "";

        data.forEach((item) => {
          const card = document.createElement("div");
          card.className = "fish-item-card";

          const imageHtml = item.image_url
            ? `<img src="${item.image_url}" alt="${item.name_en}" class="fish-item-thumb" onerror="this.outerHTML='<div class=\\'fish-item-thumb\\'>🐟</div>'">`
            : `<div class="fish-item-thumb">🐟</div>`;

          card.innerHTML = `
            <div class="fish-item-left">
              ${imageHtml}
              <div class="fish-item-details">
                <span class="fish-item-name-ml">${item.name_ml}</span>
                <span class="fish-item-name-en">${item.name_en}</span>
                <span class="fish-item-price">₹${item.price}</span>
              </div>
            </div>
            <button class="btn-deactivate" onclick="deactivateFish('${item.row_id}', this)">
              Deactivate
            </button>
          `;
          fishListEl.appendChild(card);
        });

      } catch (err) {
        console.error("Failed to load active fish:", err);
        fishListEl.innerHTML = `
          <div class="list-state" style="color: #c0392b;">
            ⚠️ Could not load active fish menu. Check backend connection.
          </div>
        `;
      }
    }

    // ============ DEACTIVATE SINGLE FISH ============
    async function deactivateFish(rowId, btn) {
      if (!confirm("Are you sure you want to deactivate this fish?")) return;

      btn.disabled = true;
      btn.textContent = "Removing...";

      try {
        const res = await fetch(getEndpoint("/api/admin/toggle-fish"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ row_id: rowId, available: false })
        });

        if (!res.ok) throw new Error("Failed to deactivate");
        await loadActiveFish();
      } catch (err) {
        alert("Failed to deactivate fish: " + err.message);
        btn.disabled = false;
        btn.textContent = "Deactivate";
      }
    }

    // ============ DEACTIVATE ALL FISH ============
    async function deactivateAllFish() {
      if (!confirm("Are you sure you want to deactivate ALL fish in today's menu?")) return;

      deactivateAllBtn.disabled = true;
      deactivateAllBtn.textContent = "Deactivating...";

      try {
        const res = await fetch(getEndpoint("/api/admin/deactivate-all"), {
          method: "POST"
        });

        if (!res.ok) throw new Error("Failed to deactivate all");
        await loadActiveFish();
      } catch (err) {
        alert("Failed to deactivate all: " + err.message);
      } finally {
        deactivateAllBtn.textContent = "Deactivate All";
      }
    }

    // ============ FORM SUBMISSION ============
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const file = fileInput.files[0];
      const nameMl = nameMlInput.value.trim();
      const nameEn = nameEnInput.value.trim();
      const priceVal = parseFloat(priceInput.value);
      const note = noteInput.value.trim();

      if (!file) {
        showError("Please choose a fish image.");
        fileInput.focus();
        return;
      }

      if (!nameMl) {
        showError("Please enter the Malayalam name.");
        nameMlInput.focus();
        return;
      }

      if (!nameEn) {
        showError("Please enter the English name.");
        nameEnInput.focus();
        return;
      }

      if (!priceVal || priceVal <= 0) {
        showError("Please enter a valid selling price greater than ₹0.");
        priceInput.focus();
        return;
      }

      const fd = new FormData();
      fd.append("image", file);
      fd.append("name_ml", nameMl);
      fd.append("name_en", nameEn);
      fd.append("price", priceVal);
      if (note) fd.append("note", note);

      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading...";

      try {
        const res = await fetch(getEndpoint("/api/admin/add-fish"), {
          method: "POST",
          body: fd
        });

        const data = await res.json().catch(() => null);

        if (!res.ok || !data || !data.ok) {
          const errMsg = (data && data.error) ? data.error : `Server returned error (${res.status})`;
          throw new Error(errMsg);
        }

        // Success: close popup, reset form, reload active fish list
        submitBtn.disabled = false;
        submitBtn.textContent = "Add Fish";
        closeAddFish();
        await loadActiveFish();

      } catch (err) {
        console.error("Add fish error:", err);
        showError(err.message || "Failed to add fish. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Add Fish";
      }
    });

    // Load active fish menu on page startup
    document.addEventListener("DOMContentLoaded", () => {
      loadActiveFish();
    });
  </script>
</body>
</html>
